<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">

<header>

<main>

    <div class="bar"><span class="chip">Динамометр <b id="dyn">—</b></span><span class="chip"><span id="l2">Рычаг</span> <b id="lv">—</b></span></div>
